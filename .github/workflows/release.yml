name: Release

# Triggered only by pushing a tag like v1.1.5.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual dry run: builds every artifact but skips publishing (the publish job
  # is gated on a tag), so a release can be validated before tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. Terminal client: pure Go, cross-compiled with CGO disabled ──────────
  tui:
    name: TUI ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { goos: linux,   goarch: arm64, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { goos: darwin,  goarch: amd64, target: x86_64-apple-darwin,      ext: tar.gz }
          - { goos: darwin,  goarch: arm64, target: aarch64-apple-darwin,     ext: tar.gz }
          - { goos: windows, goarch: amd64, target: x86_64-pc-windows-gnu,    ext: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build sextant
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="dev"
          bin="sextant"
          [ "$GOOS" = "windows" ] && bin="sextant.exe"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$bin" ./cmd/sextant

      - name: Package
        run: |
          name="sextant-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -q "dist/${name}.zip" sextant.exe
          else
            tar -czf "dist/${name}.tar.gz" sextant
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sextant-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ── 2. Desktop client: Fyne needs CGO, so each OS builds natively ──────────
  gui:
    name: GUI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goarch: amd64, target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: macos-15-intel, goarch: amd64, target: x86_64-apple-darwin,      ext: tar.gz }
          - { os: macos-15,       goarch: arm64, target: aarch64-apple-darwin,     ext: tar.gz }
          - { os: windows-latest, goarch: amd64, target: x86_64-pc-windows-gnu,    ext: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install Windows build dependencies (MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build sextant-gui (Unix)
        if: runner.os != 'Windows'
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="dev"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o sextant-gui ./cmd/sextant-gui

      - name: Build sextant-gui (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="dev"
          export CC=gcc
          export CGO_ENABLED=1
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o sextant-gui.exe ./cmd/sextant-gui

      - name: Package
        shell: bash
        run: |
          name="sextant-gui-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -q "dist/${name}.zip" sextant-gui.exe
          else
            tar -czf "dist/${name}.tar.gz" sextant-gui
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sextant-gui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ── 3. Collect every archive, hash it and publish the release ──────────────
  publish:
    name: Publish release
    needs: [tui, gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Update winget manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/winget-update.sh "$version" "" packaging/winget < artifacts/SHA256SUMS
          # Lay the manifests out the way winget-pkgs expects and ship them as a
          # release asset, so a submission needs no manual hashing.
          root="winget/manifests/coddan/Sextant/$version"
          mkdir -p "$root"
          cp packaging/winget/*.yaml "$root/"
          (cd winget && zip -q -r "../artifacts/winget-manifests-v$version.zip" manifests)

      - name: Upload winget manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: winget/manifests
          if-no-files-found: error

      - name: Publish
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true

  # ── 4. Optional: submit the filled manifests to microsoft/winget-pkgs ──────
  winget:
    name: Submit winget manifests
    needs: publish
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: No token configured
        if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN is not set; skipping submission. Download winget-manifests-*.zip from the release and run 'wingetcreate submit'."

      - name: Download manifests
        if: env.WINGET_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: winget

      - name: Install wingetcreate
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $v = $env:VERSION.TrimStart('v')
          $manifests = "winget/manifests/coddan/Sextant/$v"
          .\wingetcreate.exe validate $manifests
          .\wingetcreate.exe submit $manifests --token $env:WINGET_TOKEN
