name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  hygiene:
    name: Repo hygiene guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run hygiene guard
        run: ./scripts/hygiene-guard.sh

  build:
    name: Build, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The Fyne GUI needs CGO and the X11/OpenGL headers. The TUI does not, but
      # building the whole module in one job keeps the green light honest: nothing
      # can rot behind an untested package.
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  tui-build-independence:
    name: TUI builds without CGO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The terminal client must stay installable on a box with no GUI
      # toolchain, so it is built and tested on its own with CGO disabled.
      - name: Build and test the TUI with CGO off
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./cmd/sextant
          test -f sextant || { echo "sextant binary missing"; exit 1; }
          # Skip the Fyne frontend: it is the one that needs CGO by design.
          # `go list -e` keeps listing the healthy packages even though the GUI
          # command cannot be loaded without CGO; the filter then drops both it
          # and internal/gui before testing.
          packages="$(go list -e ./... | grep -vE '(/internal/gui|/cmd/sextant-gui)$')"
          go test $packages -count=1
          echo "OK: sextant builds and passes tests without CGO."
